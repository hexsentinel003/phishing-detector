<!DOCTYPE html>
<html>
<head>
  <title>⚠️ Phishing Warning</title>
  <style>
    body { font-family: sans-serif; background: #1a0000;
           color: #fff; text-align: center; padding: 60px; }
    h1   { color: #ff4444; font-size: 2.5em; }
    .url { background: #300; padding: 12px; border-radius: 8px;
           word-break: break-all; margin: 20px 0; }
    button { margin: 10px; padding: 12px 28px; border: none;
             border-radius: 6px; cursor: pointer; font-size: 15px; }
    .back  { background: #22c55e; color: #000; }
    .fwd   { background: #555;    color: #fff; }
  </style>
</head>
<body>
  <h1>🚨 Phishing Site Detected</h1>
  <p>Our ML model flagged this URL as a phishing attempt:</p>
  <div class="url" id="url"></div>
  <p id="conf"></p>
  <br>
  <button class="back" onclick="history.back()">← Go Back (Safe)</button>
  <button class="fwd"  id="proceed">Proceed Anyway (Risky)</button>
  <script>
    const p = new URLSearchParams(window.location.search);
    document.getElementById('url').textContent  = p.get('url')  || 'Unknown';
    document.getElementById('conf').textContent =
      `Confidence: ${Math.round(p.get('conf') * 100)}% phishing`;
    document.getElementById('proceed').onclick = () =>
      window.location.href = p.get('url');
  </script>
</body>
</html>
